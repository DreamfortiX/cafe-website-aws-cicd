name: Cafe WebApp CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


env:
  NODE_VERSION: 18

  # Docker Hub repositories
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  CLIENT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cafe-client
  SERVER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cafe-server


jobs:

  # ============================================================
  # CI
  # ============================================================
  ci:
    name: CI - Test Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # --------------------------------------------------------
      # Install Client Dependencies
      # --------------------------------------------------------
      - name: Install client dependencies
        working-directory: ./client
        run: npm install --legacy-peer-deps


      # --------------------------------------------------------
      # Install Server Dependencies
      # --------------------------------------------------------
      - name: Install server dependencies
        working-directory: ./server
        run: npm install --legacy-peer-deps


      # --------------------------------------------------------
      # Build Client
      # --------------------------------------------------------
      - name: Build client
        working-directory: ./client
        run: CI=false npm run build


      # --------------------------------------------------------
      # Docker Build Test
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build client Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: cafe-client:test


      - name: Build server Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: cafe-server:test


  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs: ci

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Login Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # Create Image Tag
      # --------------------------------------------------------
      - name: Set image tag
        id: image-tag
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Build and Push CLIENT
      # --------------------------------------------------------
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true

          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ steps.image-tag.outputs.TAG }}
            ${{ env.CLIENT_IMAGE }}:latest

          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------------
      # Build and Push SERVER
      # --------------------------------------------------------
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true

          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.image-tag.outputs.TAG }}
            ${{ env.SERVER_IMAGE }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------------
      # Docker Image Summary
      # --------------------------------------------------------
      - name: Docker image summary
        run: |
          echo "### Docker Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Client:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.CLIENT_IMAGE }}:${{ steps.image-tag.outputs.TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Server:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.SERVER_IMAGE }}:${{ steps.image-tag.outputs.TAG }}\`" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: docker

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    environment: production

    steps:

      # --------------------------------------------------------
      # Deploy using SSH
      # --------------------------------------------------------
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "======================================"
            echo "Starting EC2 Deployment"
            echo "======================================"

            # --------------------------------------------------
            # Login to Docker Hub
            # --------------------------------------------------

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin


            # --------------------------------------------------
            # Pull latest images
            # --------------------------------------------------

            echo "Pulling client image..."

            docker pull \
              ${{ env.CLIENT_IMAGE }}:latest


            echo "Pulling server image..."

            docker pull \
              ${{ env.SERVER_IMAGE }}:latest


            # --------------------------------------------------
            # Stop old containers
            # --------------------------------------------------

            echo "Stopping old containers..."

            docker stop cafe-client || true
            docker stop cafe-server || true


            # --------------------------------------------------
            # Remove old containers
            # --------------------------------------------------

            docker rm cafe-client || true
            docker rm cafe-server || true


            # --------------------------------------------------
            # Create Docker network
            # --------------------------------------------------

            docker network create cafe-network || true


            # --------------------------------------------------
            # Start SERVER container
            # --------------------------------------------------

            echo "Starting server..."

            docker run -d \
              --name cafe-server \
              --restart unless-stopped \
              --network cafe-network \
              -p 6001:6001 \
              -e NODE_ENV=production \
              -e PORT=6001 \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e CLIENT_URL="${{ vars.CLIENT_URL }}" \
              ${{ env.SERVER_IMAGE }}:latest


            # --------------------------------------------------
            # Start CLIENT container
            # --------------------------------------------------

            echo "Starting client..."

            docker run -d \
              --name cafe-client \
              --restart unless-stopped \
              --network cafe-network \
              -p 80:80 \
              ${{ env.CLIENT_IMAGE }}:latest


            # --------------------------------------------------
            # Remove unused images
            # --------------------------------------------------

            echo "Cleaning old Docker images..."

            docker image prune -f


            # --------------------------------------------------
            # Show containers
            # --------------------------------------------------

            echo "======================================"
            echo "Running Containers"
            echo "======================================"

            docker ps


            echo "======================================"
            echo "Deployment Successful"
            echo "======================================"


      # --------------------------------------------------------
      # Deployment Summary
      # --------------------------------------------------------
      - name: Deployment summary
        run: |

          echo "### 🚀 Cafe WebApp Deployment" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Deployment:** AWS EC2" >> "$GITHUB_STEP_SUMMARY"

          echo "**Registry:** Docker Hub" >> "$GITHUB_STEP_SUMMARY"

          echo "**Client:** \`${{ env.CLIENT_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"

          echo "**Server:** \`${{ env.SERVER_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Docker images successfully pulled and deployed to EC2." >> "$GITHUB_STEP_SUMMARY"
